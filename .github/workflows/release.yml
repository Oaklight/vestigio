name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.2.0, without v prefix)"
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate version input
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "$VERSION" =~ ^v ]]; then
            echo "::error::Version should not include 'v' prefix (e.g. 0.2.0, not v0.2.0)"
            exit 1
          fi

      - name: Check tag does not exist
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if git ls-remote --tags origin | grep -q "refs/tags/v${VERSION}$"; then
            echo "::error::Tag v${VERSION} already exists"
            exit 1
          fi

      - name: Verify version matches package
        env:
          VERSION: ${{ inputs.version }}
        run: |
          PKG_VER=$(python -c "import re; m=re.search(r\"__version__\s*=\s*[\\\"'](.+?)[\\\"']\", open('src/vestigio/__init__.py').read()); print(m.group(1) if m else '')")
          echo "Package version: $PKG_VER"
          echo "Requested version: $VERSION"
          if [ -z "$PKG_VER" ]; then
            echo "::error::Could not extract __version__ from __init__.py"
            exit 1
          fi
          [ "$PKG_VER" = "$VERSION" ] || \
            (echo "::error::Version mismatch: __init__.py has $PKG_VER but release requested $VERSION"; exit 1)

      - name: Install dependencies
        run: pip install ".[dev]"

      - name: Lint (ruff + ty)
        uses: pre-commit/action@v3.0.1

      - name: Run tests
        run: pytest tests/ -v --cov=vestigio --cov-fail-under=100

      - name: Create and push git tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${VERSION}"
          git push origin "v${VERSION}"

  build-publish:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel + sdist
        run: |
          pip install --upgrade pip build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          retention-days: 7

  github-release:
    needs: build-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "v${VERSION}" dist/* \
            --repo "${{ github.repository }}" \
            --title "v${VERSION}" \
            --generate-notes
