[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vestigio"
dynamic = ["version"]
description = "Thin OTEL wrapper for agent/LLM observability — OpenInference + GenAI semantic conventions"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Oaklight", email = "oaklight@gmx.com" }]
keywords = ["opentelemetry", "observability", "tracing", "llm", "agent", "openinference"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]

dependencies = []

[project.optional-dependencies]
otel = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
]
otlp = [
    "vestigio[otel]",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pre-commit>=3.0.0",
    "ruff==0.16.6",
    "ty==0.0.54",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
]

[project.urls]
Repository = "https://github.com/Oaklight/vestigio"
Issues = "https://github.com/Oaklight/vestigio/issues"

[tool.setuptools.dynamic]
version = { attr = "vestigio.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"vestigio" = ["py.typed"]

[tool.ruff]
line-length = 99
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ty.rules]
# opentelemetry is an optional dependency — deferred imports are intentional
unresolved-import = "ignore"
